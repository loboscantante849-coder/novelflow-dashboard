name: Release to Tencent
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tencent-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; fi
          npm run check
      - name: Package tracked source
        run: |
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/release.tgz"
      - name: Send to restricted deployment receiver
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_KEY }}
          HOST_KEYS: ${{ secrets.TENCENT_HOST_KEYS }}
          DEPLOY_HOST: ${{ vars.TENCENT_HOST }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$HOST_KEYS" > "$RUNNER_TEMP/known_hosts"
          ssh -T -i "$RUNNER_TEMP/deploy-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "ubuntu@$DEPLOY_HOST" < "$RUNNER_TEMP/release.tgz"
